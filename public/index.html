<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandich Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 17V3h6a4.5 4.5 0 010 9H8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span> / <b>Pandich Lab</b></div>
  <div class="tb-sep"></div>
  <span id="backendBadge" class="badge"></span>
  <div class="spacer"></div>
  <span id="clock" class="clock"></span>
</header>

<main class="layout">
  <!-- ───────── Left: AI chat ───────── -->
  <aside class="chat empty" id="chatPanel">
    <div class="chat-rail" id="chatRail" title="Открыть Panda (Ctrl+\)">
      <button class="icon-btn rail-open" id="chatExpandBtn" aria-label="Открыть Panda"><svg class="panda-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5.6" cy="6" r="3" fill="currentColor"/><circle cx="18.4" cy="6" r="3" fill="currentColor"/><circle cx="12" cy="13" r="8.4" fill="var(--panel)" stroke="currentColor" stroke-width="1.6"/><ellipse cx="8.7" cy="12.3" rx="1.9" ry="2.6" transform="rotate(-28 8.7 12.3)" fill="currentColor"/><ellipse cx="15.3" cy="12.3" rx="1.9" ry="2.6" transform="rotate(28 15.3 12.3)" fill="currentColor"/><ellipse cx="12" cy="16.4" rx="1.4" ry="1" fill="currentColor"/></svg></button>
      <span class="chat-rail-label">Panda</span>
    </div>
    <div class="chat-head">
      <span class="chat-title"><svg class="panda-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5.6" cy="6" r="3" fill="currentColor"/><circle cx="18.4" cy="6" r="3" fill="currentColor"/><circle cx="12" cy="13" r="8.4" fill="var(--panel)" stroke="currentColor" stroke-width="1.6"/><ellipse cx="8.7" cy="12.3" rx="1.9" ry="2.6" transform="rotate(-28 8.7 12.3)" fill="currentColor"/><ellipse cx="15.3" cy="12.3" rx="1.9" ry="2.6" transform="rotate(28 15.3 12.3)" fill="currentColor"/><ellipse cx="12" cy="16.4" rx="1.4" ry="1" fill="currentColor"/></svg><span>Panda</span></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="newChatBtn" title="Новый чат">＋</button>
      <button class="icon-btn" id="chatCollapseBtn" title="Скрыть панель (Ctrl+\)" aria-label="Скрыть панель Panda"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M6 2.5v11M10.8 6.2L8.9 8l1.9 1.8"/></svg></button>
    </div>
    <div class="chat-body" id="chatBody"><div id="messages"></div></div>
    <div class="composer-wrap" id="composerWrap">
      <div class="hero" id="hero">
        <div class="hero-logo"><svg viewBox="0 0 20 20" width="44" height="44"><path d="M5 17V3h6a4.5 4.5 0 010 9H8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1>Начнём, когда будете готовы</h1>
      </div>
      <div id="editChip" class="edit-chip hidden"></div>
      <div class="composer" id="composer">
        <div id="attachments" class="attachments"></div>
        <div class="prompt-row">
          <textarea id="prompt" rows="2"></textarea>
          <span class="tabhint" id="tabHint" title="Tab — подставить подсказку">Tab</span>
        </div>
        <div class="composer-row">
          <button class="round" id="plusBtn" title="Приложить">＋</button>
          <select id="modelSel" title="Модель"></select>
          <div class="spacer"></div>
          <button id="stopBtn" class="btn ghost hidden">Стоп</button>
          <button class="round" id="micBtn" title="Голосовой ввод"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="6.5" y="2" width="5" height="9" rx="2.5"/><path d="M3.5 8.5a5.5 5.5 0 0011 0M9 14v2.5"/></svg></button>
          <button id="sendBtn" class="send" title="Отправить (Enter)">➤</button>
        </div>
        <div id="plusMenu" class="popmenu hidden">
          <button data-act="snap"><span class="pi" data-icon="chart"></span>Снимок моего графика</button>
          <button data-act="img"><span class="pi" data-icon="image"></span>Изображение / скриншот…</button>
          <button data-act="pine"><span class="pi" data-icon="code"></span>Файл Pine Script (.pine, .txt)…</button>
        </div>
      </div>
      <div class="mode-row" id="modeRow">
        <div class="mode-pill">
          <button class="mode-main" id="modeMain"><span class="pi" id="modeIcon"></span><span class="muted">Попробуйте:</span> <b id="modeName"></b></button>
          <button class="mode-caret" id="modeCaret" title="Режимы">⌄</button>
        </div>
        <div id="modeMenu" class="popmenu hidden"></div>
      </div>
      <div class="suggest" id="suggest"></div>
      <div class="disclaimer">Panda может ошибаться. Проверяйте важные результаты, прежде чем торговать.</div>
    </div>
    <input type="file" id="fileImg" accept="image/*" multiple hidden>
    <input type="file" id="filePine" accept=".pine,.txt,.pinescript" hidden>
  </aside>

  <!-- ───────── Right: chart ───────── -->
  <section class="workspace">
    <div class="toolbar">
      <button class="tb-sym" id="symBtn" title="Поиск символа (или начни печатать букву на графике)"><svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M12.2 12.2L16 16"/></svg><b id="symTxt">—</b></button>
      <div class="tb-dd"><button class="tb-btn" id="tfBtn" title="Таймфрейм (или набери цифру на графике)"><span id="tfTxt">15m</span><svg viewBox="0 0 10 10" width="9" height="9"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button><div class="popmenu hidden tf-pop" id="tfPop"></div></div>
      <div class="tb-dd"><button class="tb-btn icon" id="ctypeBtn" title="Тип графика"><span id="ctypeIcon"></span></button><div class="popmenu hidden" id="ctypePop"></div></div>
      <div class="tb-dd"><button class="tb-btn icon" id="scaleBtn" title="Шкала цен"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13 2v14M13 5h3M13 9h2M13 13h3M2 14l3-4 3 2 3-6"/></svg></button><div class="popmenu hidden" id="scalePop"></div></div>
      <div class="tb-dd mc-only"><button class="tb-btn icon" id="layoutBtn" title="Мульти-график: раскладка и синхронизация"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="13" height="13" rx="1.5"/><path d="M9 2.5v13M2.5 9h13"/></svg></button><div class="popmenu hidden mc-pop" id="layoutPop"></div></div>
      <select id="barsSel" title="Количество баров">
        <option>500</option><option>1000</option><option selected>1500</option><option>3000</option><option>5000</option>
      </select>
      <div class="tb-sep"></div>
      <button class="btn" id="addScriptBtn">ƒ Новый скрипт</button>
      <button class="btn" id="editorBtn">⟨/⟩ Pine-редактор</button>
      <div class="spacer"></div>
      <span id="dataStatus" class="muted"></span>
    </div>
    <div class="chart-row">
      <div class="dtools" id="dtools"></div>
      <div class="mc-grid" id="mcGrid" data-layout="1">
        <div class="chart-wrap" id="chartWrap">
          <div id="chart"></div>
          <canvas id="overlay"></canvas>
          <div id="legend" class="legend"></div>
          <div id="tables"></div>
        </div>
      </div>
      <div class="rpanels" id="rpanels"></div>
      <div class="rail" id="rail"></div>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script src="/vendor/lwc.js"></script>
<script src="/app.js"></script>
<script src="/drawings.js"></script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script src="/panels.js"></script>
<script src="/chartui.js"></script>
<script src="/multichart.js"></script>
<script src="/replay.js"></script>
<script src="/watch.js"></script>
<script src="/library.js"></script>
<script src="/settings.js"></script>
</body>
</html>
