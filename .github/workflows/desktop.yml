# Builds the Pandich Lab desktop app for Windows (.exe installer) and macOS (.dmg, universal).
# Manual run (Actions → Desktop build → Run workflow): installers as downloadable artifacts;
# tick "Publish a GitHub Release" to publish release v<version> from desktop/package.json.
# A pushed tag v* publishes too.
# Release assets: versioned files + latest*.yml + blockmaps (auto-update), and stable-name copies
# for direct links:  …/releases/latest/download/PandichLab-Setup.exe  and  …/PandichLab-mac.dmg
name: Desktop build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (v<version> from desktop/package.json)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server dependencies
        run: npm ci --omit=dev
      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        shell: bash
        run: |
          TARGET=$([ "$RUNNER_OS" = "Windows" ] && echo "--win --x64" || echo "--mac")
          npx electron-builder $TARGET --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PandichLab-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          TAG="v$VER"
          cd out
          cp PandichLab-$VER-win-x64.exe PandichLab-Setup.exe
          cp PandichLab-$VER-mac-universal.dmg PandichLab-mac.dmg
          ls -la
          # human-written notes for this version (section "## <version>" in desktop/RELEASE_NOTES.md) + the install footer
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' ../desktop/RELEASE_NOTES.md > ../notes.md
          cat >> ../notes.md <<'FOOT'

          ---
          **Скачать · Download:** Windows — `PandichLab-Setup.exe` · macOS — `PandichLab-mac.dmg`. Обновление приходит само · Updates install automatically.

          Установщики пока не подписаны · Not code-signed yet:
          - Windows: «Подробнее» → «Выполнить в любом случае» · More info → Run anyway
          - macOS: «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть» · System Settings → Privacy & Security → Open Anyway

          Panda работает через твою подписку Claude (Pro/Max) или API-ключ; всё остальное бесплатно · Panda uses your own Claude subscription or API key; everything else is free.
          FOOT
          sed -i 's/^          //' ../notes.md
          cat ../notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
            gh release edit "$TAG" --notes-file ../notes.md
          else
            gh release create "$TAG" * --title "Pandich Lab $VER" --notes-file ../notes.md --latest
          fi
